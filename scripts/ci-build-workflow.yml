#
# Windows(.exe/.zip) 와 Linux(AppImage/DEB/RPM) 를 각 OS 러너에서 만들고
# SHA-256 해시를 생성해 아티팩트로 올린다. 태그를 밀면 Release 초안이 만들어진다.

name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci || npm install
      - run: npm run verify

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
          - os: ubuntu-latest
            script: dist:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install RPM tooling (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - run: npm ci || npm install
      - run: npm run ${{ matrix.script }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run hash

      - uses: actions/upload-artifact@v4
        with:
          name: yeoulgame-ssh-client-${{ runner.os }}
          path: |
            release/*.exe
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/SHA256SUMS.txt
          if-no-files-found: warn

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: artifacts/**/*
          body: |
            Yeoulgame SSH Client ${{ github.ref_name }}

            개발처: 여울게임터 (https://yeoulgame.com)
            라이선스: MIT

            설치 전 SHA256SUMS.txt 로 해시를 검증하세요.
